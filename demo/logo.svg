<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Minimalist Geometric Data-to-Growth Mark -->
  <g transform="translate(10, 10)">
    <!-- Signal Level Lines (Representing Filtered Schema Data) -->
    <path d="M 140 340 L 210 340" stroke="#1E293B" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 270 L 180 270" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Primary Growth Trend Vector -->
    <path d="M 140 340 L 210 270 L 280 300 L 370 170" 
          fill="none" 
          stroke="url(#accent)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Dynamic Arrow Head -->
    <path d="M 300 170 L 370 170 L 370 240" 
          fill="none" 
          stroke="url(#accent)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Signal Node -->
    <circle cx="370" cy="170" r="12" fill="#FFFFFF"/>
  </g>
</svg>
